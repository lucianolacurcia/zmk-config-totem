name: Generate Keyboard Visualizer Files
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"
      - "*.keymap"  # QMK keymaps

jobs:
  # Generate keymap YAML using keymap-drawer (works for both ZMK and QMK)
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"  # ZMK pattern
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"

  # Detect keyboard and generate visualizer files
  prepare-visualizer:
    runs-on: ubuntu-latest
    needs: draw
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Detect keyboard and generate layout file
        run: |
          set -e
          mkdir -p visualizer
          echo "🔍 Detecting keyboard type and layout..."

          # Find generated YAML file to detect keyboard
          YAML_FILE=""
          if [ -d "keymap-drawer" ]; then
            YAML_FILE=$(find keymap-drawer -name "*.yaml" -type f | head -1)
          fi

          if [ -z "$YAML_FILE" ] || [ ! -f "$YAML_FILE" ]; then
            echo "❌ No YAML file found in keymap-drawer output"
            echo "Available files:"
            find keymap-drawer -type f 2>/dev/null || echo "No keymap-drawer directory"
            exit 1
          fi

          echo "📄 Found keymap file: $YAML_FILE"

          # Extract keyboard info from YAML
          QMK_KB=$(grep "qmk_keyboard:" "$YAML_FILE" | cut -d' ' -f2- | tr -d '"' || echo "")
          ZMK_KB=$(grep "zmk_keyboard:" "$YAML_FILE" | cut -d' ' -f2- | tr -d '"' || echo "")

          echo "🔍 QMK keyboard: '$QMK_KB'"
          echo "🔍 ZMK keyboard: '$ZMK_KB'"

          LAYOUT_FILE="visualizer/layout.json"

          # Try QMK API first if qmk_keyboard is specified
          if [ -n "$QMK_KB" ] && [ "$QMK_KB" != "null" ]; then
            echo "🔍 Trying QMK API for keyboard: $QMK_KB"
            QMK_URL="https://keyboards.qmk.fm/v1/keyboards/$QMK_KB/info.json"

            if curl -s -f "$QMK_URL" | jq '.keyboards' > /tmp/qmk_response.json 2>/dev/null; then
              echo "✅ Found $QMK_KB in QMK database"

              # Extract layout from QMK response and convert to our format
              jq '
                .keyboards | to_entries[0].value |
                {
                  "url": (.url // ""),
                  "layouts": .layouts
                }
              ' /tmp/qmk_response.json > "$LAYOUT_FILE"

              echo "✅ QMK layout downloaded and converted"
            else
              echo "❌ $QMK_KB not found in QMK API, trying keymap-drawer extras..."
              QMK_KB=""  # Reset to try keymap-drawer
            fi
          fi

          # Fallback to keymap-drawer extra layouts
          if [ ! -f "$LAYOUT_FILE" ]; then
            # Try ZMK keyboard name or QMK keyboard name
            KB_NAME="$ZMK_KB"
            if [ -z "$KB_NAME" ] && [ -n "$QMK_KB" ]; then
              KB_NAME="$QMK_KB"
            fi

            if [ -n "$KB_NAME" ]; then
              echo "🔍 Trying keymap-drawer extras for: $KB_NAME"

              # Try exact match first
              EXTRA_URL="https://raw.githubusercontent.com/caksoylar/keymap-drawer/main/resources/extra_layouts/$KB_NAME.json"
              if curl -s -f "$EXTRA_URL" -o "$LAYOUT_FILE"; then
                echo "✅ Found $KB_NAME.json in keymap-drawer extras"
              else
                # Try common variations
                echo "❌ $KB_NAME.json not found, trying variations..."

                # List available layouts for debugging
                echo "📋 Available layouts in keymap-drawer extras:"
                curl -s "https://api.github.com/repos/caksoylar/keymap-drawer/contents/resources/extra_layouts" | \
                  jq -r '.[].name' | head -10

                echo "❌ No layout found for keyboard: $KB_NAME"
                echo "💡 Please check available layouts at:"
                echo "   https://github.com/caksoylar/keymap-drawer/tree/main/resources/extra_layouts"
                exit 1
              fi
            else
              echo "❌ No keyboard name found in YAML file"
              echo "💡 Please ensure your keymap YAML has either 'qmk_keyboard:' or 'zmk_keyboard:' field"
              exit 1
            fi
          fi

          # Copy YAML file with standard name
          cp "$YAML_FILE" visualizer/keymap.yaml

          echo "✅ Files ready in visualizer/ folder:"
          ls -la visualizer/

      - name: Commit visualizer files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add visualizer/
          if ! git diff --staged --quiet; then
            git commit -m "🎹 Update keyboard visualizer files

            Generated by keyboard-visualizer workflow:
            - layout.json: Physical keyboard layout
            - keymap.yaml: Keymap configuration

            Use with: keyboard-visualizer ${{ github.repository }}"
            git push
          else
            echo "No changes to commit"
          fi