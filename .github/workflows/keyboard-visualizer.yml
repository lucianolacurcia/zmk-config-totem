name: Generate Keyboard Visualizer Files
on:
  workflow_dispatch:
  push:  # Trigger on any push - universal compatibility

jobs:
  # Generate visualizer files for both ZMK and QMK
  prepare-visualizer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip
          pip3 install keymap-drawer

      - name: Detect keyboard type and generate files
        run: |
          set -e
          mkdir -p visualizer
          echo "🔍 Auto-detecting keyboard type..."

          # Detect keyboard type by files present
          KEYMAP_FILE=""
          KEYBOARD_TYPE=""

          # Check for ZMK (.keymap files)
          if [ -n "$(find . -name "*.keymap" -type f 2>/dev/null)" ]; then
            KEYBOARD_TYPE="ZMK"
            KEYMAP_FILE=$(find . -name "*.keymap" -type f | head -1)
            echo "🔍 Detected: ZMK keyboard (.keymap files found)"
            echo "📄 Using keymap: $KEYMAP_FILE"

          # Check for QMK (keymap.c files)
          elif [ -n "$(find . -name "keymap.c" -type f 2>/dev/null)" ]; then
            KEYBOARD_TYPE="QMK"
            KEYMAP_FILE=$(find . -name "keymap.c" -type f | head -1)
            echo "🔍 Detected: QMK keyboard (keymap.c files found)"
            echo "📄 Using keymap: $KEYMAP_FILE"

          else
            echo "❌ No keymap files found (.keymap or keymap.c)"
            echo "📁 Repository contents:"
            find . -type f -name "*keymap*" -o -name "*.keymap" -o -name "*.c" | head -10
            exit 1
          fi

          # Generate YAML using keymap-drawer
          echo "📝 Generating keymap YAML..."
          if [ "$KEYBOARD_TYPE" = "ZMK" ]; then
            keymap draw "$KEYMAP_FILE" -o /tmp/keymap.yaml --config keymap_drawer.config.yaml 2>/dev/null || \
            keymap draw "$KEYMAP_FILE" -o /tmp/keymap.yaml 2>/dev/null || {
              echo "❌ Failed to parse ZMK keymap with keymap-drawer"
              exit 1
            }

          elif [ "$KEYBOARD_TYPE" = "QMK" ]; then
            # For QMK, we need to determine the keyboard name from the keymap.c path
            # Usually in: keyboards/keyboard_name/keymaps/keymap_name/keymap.c
            KEYMAP_DIR=$(dirname "$KEYMAP_FILE")
            KB_PATH=$(echo "$KEYMAP_DIR" | sed 's|keyboards/||' | sed 's|/keymaps.*||')

            if [ -n "$KB_PATH" ]; then
              echo "🔍 Detected QMK keyboard: $KB_PATH"
              keymap draw -k "$KB_PATH" "$KEYMAP_FILE" -o /tmp/keymap.yaml 2>/dev/null || {
                echo "❌ Failed to parse QMK keymap. Please specify qmk_keyboard in your keymap"
                exit 1
              }
            else
              echo "❌ Could not determine QMK keyboard name from path: $KEYMAP_FILE"
              echo "💡 Please ensure your keymap.c has 'qmk_keyboard:' comment or is in standard QMK path"
              exit 1
            fi
          fi

          if [ ! -f "/tmp/keymap.yaml" ]; then
            echo "❌ Failed to generate keymap YAML"
            exit 1
          fi

          echo "✅ Generated keymap YAML"

          # Extract keyboard info from generated YAML
          QMK_KB=$(grep "qmk_keyboard:" /tmp/keymap.yaml | cut -d' ' -f2- | tr -d '"' | tr -d "'" || echo "")
          ZMK_KB=$(grep "zmk_keyboard:" /tmp/keymap.yaml | cut -d' ' -f2- | tr -d '"' | tr -d "'" || echo "")

          echo "🔍 QMK keyboard: '$QMK_KB'"
          echo "🔍 ZMK keyboard: '$ZMK_KB'"

          LAYOUT_FILE="visualizer/layout.json"

          # Try QMK API first if qmk_keyboard is specified
          if [ -n "$QMK_KB" ] && [ "$QMK_KB" != "null" ]; then
            echo "🔍 Trying QMK API for keyboard: $QMK_KB"
            QMK_URL="https://keyboards.qmk.fm/v1/keyboards/$QMK_KB/info.json"

            if curl -s -f "$QMK_URL" | jq '.keyboards' > /tmp/qmk_response.json 2>/dev/null; then
              echo "✅ Found $QMK_KB in QMK database"

              # Extract layout from QMK response and convert to our format
              jq '
                .keyboards | to_entries[0].value |
                {
                  "url": (.url // ""),
                  "layouts": .layouts
                }
              ' /tmp/qmk_response.json > "$LAYOUT_FILE"

              echo "✅ QMK layout downloaded and converted"
            else
              echo "❌ $QMK_KB not found in QMK API, trying keymap-drawer extras..."
              QMK_KB=""  # Reset to try keymap-drawer
            fi
          fi

          # Fallback to keymap-drawer extra layouts
          if [ ! -f "$LAYOUT_FILE" ]; then
            # Try ZMK keyboard name or QMK keyboard name
            KB_NAME="$ZMK_KB"
            if [ -z "$KB_NAME" ] && [ -n "$QMK_KB" ]; then
              KB_NAME="$QMK_KB"
            fi

            if [ -n "$KB_NAME" ]; then
              echo "🔍 Trying keymap-drawer extras for: $KB_NAME"

              # Try exact match first
              EXTRA_URL="https://raw.githubusercontent.com/caksoylar/keymap-drawer/main/resources/extra_layouts/$KB_NAME.json"
              if curl -s -f "$EXTRA_URL" -o "$LAYOUT_FILE"; then
                echo "✅ Found $KB_NAME.json in keymap-drawer extras"
              else
                echo "❌ $KB_NAME.json not found in keymap-drawer extras"
                echo "📋 Available layouts:"
                curl -s "https://api.github.com/repos/caksoylar/keymap-drawer/contents/resources/extra_layouts" | \
                  jq -r '.[].name' | head -10

                echo "💡 Please check available layouts at:"
                echo "   https://github.com/caksoylar/keymap-drawer/tree/main/resources/extra_layouts"
                exit 1
              fi
            else
              echo "❌ No keyboard name found in YAML file"
              echo "💡 Please ensure your keymap has qmk_keyboard or zmk_keyboard specified"
              exit 1
            fi
          fi

          # Copy YAML file with standard name
          cp /tmp/keymap.yaml visualizer/keymap.yaml

          echo "✅ Files ready in visualizer/ folder:"
          ls -la visualizer/

      - name: Commit visualizer files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add visualizer/
          if ! git diff --staged --quiet; then
            git commit -m "🎹 Update keyboard visualizer files

            Generated by keyboard-visualizer workflow:
            - layout.json: Physical keyboard layout
            - keymap.yaml: Keymap configuration

            Use with: keyboard-visualizer ${{ github.repository }}"
            git push
          else
            echo "No changes to commit"
          fi